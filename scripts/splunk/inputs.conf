# Splunk Universal Forwarder inputs: tail Wazuh alerts (bind-mounted at /wazuh-logs).
# Level >= 3 filter enforced Wazuh-side by rule design; belt-and-braces blacklist here.
# Cap verification: index=main earliest=-24h | stats count

[monitor:///wazuh-logs/alerts/alerts.json]
disabled = false
index = main
sourcetype = _json
blacklist = "level"\s*:\s*[0-2]\b
