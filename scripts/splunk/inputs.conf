# Splunk Universal Forwarder inputs.conf
# Source of truth: plan milestone Week 1 — Splunk Enterprise container + UF (host service)
# Wazuh pre-filters: only alerts with level >= 3 are forwarded.
# Free tier cap verification: index=main earliest=-24h | stats count

[monitor:///var/ossec/logs/alerts/alerts.json]
disabled = false
index = main
sourcetype = json
source = wazuh_alerts
host = soc-vm

# Blacklist: suppress low-level noise (only level >= 3 passes from Wazuh manager)
# This is the Splunk-side filter mirror; the primary filter is in Wazuh rules.
BLACKLISTED_KEYS = rule.level,.*level.*\"(0|1|2)\"

[default]
host = soc-vm
